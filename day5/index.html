<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 | Users and REST APIs</title>
  <script src="users.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
      color: #1f2933;
      background-color: #eef2f6;
    }

    main {
      max-width: 46rem;
      margin: 0 auto;
    }

    h1 { margin-bottom: 0.25rem; }
    .hint { margin-top: 0; color: #616e7c; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }

    .field { flex: 1 1 14rem; }

    label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    button {
      padding: 0.6rem 1.1rem;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background-color: #2b6cb0;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) { background-color: #1f4e79; }

    /* the button is disabled while the request is in flight */
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input {
      width: 100%;
      padding: 0.55rem 0.65rem;
      font: inherit;
      border: 1px solid #cbd2d9;
      border-radius: 6px;
    }

    #status {
      padding: 0.6rem 0.85rem;
      font-weight: 600;
      background-color: #ffffff;
      border: 1px solid #e4e7eb;
      border-left: 5px solid #2b6cb0;
      border-radius: 6px;
    }

    #status.is-error {
      color: #9b2c2c;
      border-left-color: #c53030;
    }

    #users-list {
      margin: 1rem 0 0;
      padding: 0;
      list-style: none;
    }

    .user-card {
      margin-bottom: 0.75rem;
      padding: 0.9rem 1rem;
      background-color: #ffffff;
      border: 1px solid #e4e7eb;
      border-left: 5px solid #2b6cb0;
      border-radius: 8px;
    }

    .user-card h2 {
      margin: 0 0 0.3rem;
      font-size: 1.05rem;
    }

    .user-card p { margin: 0.1rem 0; }

    .user-email { color: #2b6cb0; }
    .user-company { color: #616e7c; font-size: 0.9rem; }

    .empty {
      padding: 0.9rem 1rem;
      color: #616e7c;
      background-color: #ffffff;
      border: 1px dashed #cbd2d9;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <main>
    <h1>Users Directory</h1>
    <p class="hint">Fetches users from JSONPlaceholder with the Fetch API.</p>

    <div class="toolbar">
      <button type="button" id="load-users">Load users</button>

      <div class="field">
        <label for="filter-input">Filter by name</label>
        <input type="search" id="filter-input" placeholder="e.g. leanne" autocomplete="off">
      </div>
    </div>

    <p id="status">Press "Load users" to begin.</p>

    <ul id="users-list"></ul>
  </main>

</body>
</html>
